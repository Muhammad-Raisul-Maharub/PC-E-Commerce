<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="neonCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF9E00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Cyber Anvil & Liquid Coolant Hexagon Icon -->
  <polygon points="28,8 48,18 48,42 28,52 8,42 8,18" stroke="#00F0FF" stroke-width="2.5" fill="#0A0A0F" filter="url(#glow)"/>
  <!-- Liquid Loop Tubes inside Icon -->
  <path d="M18,22 L28,16 L38,22 L38,36 L28,44 L18,36 Z" stroke="#FF6B00" stroke-width="2" fill="none" opacity="0.8"/>
  <circle cx="28" cy="30" r="4" fill="#00F0FF" filter="url(#glow)"/>
  <!-- Flow Lines -->
  <line x1="8" y1="30" x2="18" y2="30" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="38" y1="30" x2="48" y2="30" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Brand Wordmark -->
  <text x="62" y="34" font-family="'Chakra Petch', 'Space Grotesk', sans-serif" font-size="24" font-weight="900" letter-spacing="2" fill="#F8FAFC">NEON<tspan fill="#00F0FF">FORGE</tspan></text>
  <text x="63" y="48" font-family="'Rajdhani', monospace" font-size="9" font-weight="700" letter-spacing="4" fill="#FF6B00">PRECISION MOD LAB // DHAKA</text>
</svg>